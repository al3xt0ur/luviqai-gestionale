name: Verifiche automatiche
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'codex/**', 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build e test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
          run_install: false
      - name: Installa dipendenze dal lockfile
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript e Vite
        run: pnpm run build
      - name: Test su database temporanei
        run: pnpm test
